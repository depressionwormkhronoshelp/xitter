# Сборка Xitter: APK, IPA, веб-версия и сервер.
# Запускается при каждом push в main и вручную (Actions → Build Xitter → Run workflow).
# Готовые файлы: в Artifacts каждого запуска и в релизе «latest» (вкладка Releases).
name: Build Xitter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (.apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Номер сборки
        shell: bash
        run: |
          echo "window.XITTER_BUILD = { run: ${{ github.run_number }}, sha: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > web/version.js
      - name: Инструменты Android
        run: sudo apt-get update && sudo apt-get install -y aapt zipalign apksigner dalvik-exchange
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash android/build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Xitter-android
          path: dist/Xitter.apk

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Номер сборки
        shell: bash
        run: |
          echo "window.XITTER_BUILD = { run: ${{ github.run_number }}, sha: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > web/version.js
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Сборка .exe
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v5
        with:
          name: Xitter-windows
          path: |
            desktop/dist/Xitter.exe
            desktop/dist/Xitter-Setup.exe

  linux:
    name: Linux (.AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Номер сборки
        shell: bash
        run: |
          echo "window.XITTER_BUILD = { run: ${{ github.run_number }}, sha: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > web/version.js
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Сборка AppImage
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run dist:linux
      - uses: actions/upload-artifact@v5
        with:
          name: Xitter-linux
          path: desktop/dist/Xitter-x86_64.AppImage

  ios:
    name: iOS (.ipa, без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Номер сборки
        shell: bash
        run: |
          echo "window.XITTER_BUILD = { run: ${{ github.run_number }}, sha: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > web/version.js
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Сборка IPA
        run: bash ios-build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Xitter-ios
          path: dist/Xitter-unsigned.ipa

  web:
    name: Веб-версия
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Номер сборки
        shell: bash
        run: |
          echo "window.XITTER_BUILD = { run: ${{ github.run_number }}, sha: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > web/version.js
          # сброс кэша: у файлов в index.html меняется ?v= при каждой сборке
          sed -i -E 's#(href|src)="(fonts/fonts\.css|styles\.css|version\.js|vendor/firebase\.js|backend\.js|app\.js)"#\1="\2?v=${{ github.run_number }}"#g' web/index.html
      - uses: actions/download-artifact@v5
        with:
          name: Xitter-android
          path: web/download
      - name: Архив веб-версии
        run: mkdir -p dist && (cd web && zip -qr ../dist/Xitter-web.zip .)
      - uses: actions/upload-artifact@v5
        with:
          name: Xitter-web
          path: dist/Xitter-web.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  server:
    name: Сервер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Номер сборки
        shell: bash
        run: |
          echo "window.XITTER_BUILD = { run: ${{ github.run_number }}, sha: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > web/version.js
          # сброс кэша: у файлов в index.html меняется ?v= при каждой сборке
          sed -i -E 's#(href|src)="(fonts/fonts\.css|styles\.css|version\.js|vendor/firebase\.js|backend\.js|app\.js)"#\1="\2?v=${{ github.run_number }}"#g' web/index.html
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Сервер с зависимостями
        run: |
          cd server && npm install --omit=dev && cd ..
          mkdir -p dist/Xitter-server
          cp -r server web start-server.sh start-ngrok.sh start-server.command start-server.bat README.md dist/Xitter-server/
          rm -rf dist/Xitter-server/server/data
          (cd dist && zip -qr Xitter-server.zip Xitter-server)
      - uses: actions/upload-artifact@v5
        with:
          name: Xitter-server
          path: dist/Xitter-server.zip

  pages:
    name: Публикация на GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true # включите Pages: Settings → Pages → Source: GitHub Actions
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  firebase:
    name: Правила Firestore и Firebase Hosting
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - name: Номер сборки
        shell: bash
        run: |
          echo "window.XITTER_BUILD = { run: ${{ github.run_number }}, sha: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > web/version.js
          # сброс кэша: у файлов в index.html меняется ?v= при каждой сборке
          sed -i -E 's#(href|src)="(fonts/fonts\.css|styles\.css|version\.js|vendor/firebase\.js|backend\.js|app\.js)"#\1="\2?v=${{ github.run_number }}"#g' web/index.html
      - name: Деплой (нужен секрет FIREBASE_SERVICE_ACCOUNT)
        if: env.SA != ''
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@15 deploy --only firestore:rules,hosting --project xittererere --non-interactive
      - name: Пропуск
        if: env.SA == ''
        run: echo "Секрет FIREBASE_SERVICE_ACCOUNT не задан, деплой в Firebase пропущен (см. README)."

  ftp:
    name: Выкладка на хостинг по FTP
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR || '/www/x.lozhka.fun' }}
    steps:
      - uses: actions/checkout@v5
      - name: Номер сборки
        shell: bash
        run: |
          echo "window.XITTER_BUILD = { run: ${{ github.run_number }}, sha: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > web/version.js
          # сброс кэша: у файлов в index.html меняется ?v= при каждой сборке
          sed -i -E 's#(href|src)="(fonts/fonts\.css|styles\.css|version\.js|vendor/firebase\.js|backend\.js|app\.js)"#\1="\2?v=${{ github.run_number }}"#g' web/index.html
        if: env.FTP_SERVER != ''
      - uses: actions/download-artifact@v5
        if: env.FTP_SERVER != ''
        with:
          name: Xitter-android
          path: web/download
      - name: Загрузка веб-версии (нужны секреты FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)
        if: env.FTP_SERVER != ''
        run: |
          sudo apt-get install -y lftp >/dev/null
          # файлы только добавляются и обновляются, чужие файлы на хостинге не удаляются
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "set cmd:fail-exit yes; set ftp:ssl-allow yes; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30; cd $FTP_DIR || echo 'Папки нет, загружаю в домашнюю папку FTP'; pwd; mirror -R web .; bye" 2>&1 | tee ftp.log
          echo "::notice title=FTP::$(grep -iE 'папк|ftp:/|error|fatal|denied' ftp.log | head -5 | tr '\n' ' ')"
      - name: Проверка сайта https://x.lozhka.fun
        if: env.FTP_SERVER != ''
        continue-on-error: true
        run: |
          set +e
          sleep 5
          for u in https://x.lozhka.fun/ http://x.lozhka.fun/ https://x.lozhka.fun/backend.js; do
            code=$(curl -ksSL --max-time 20 -o page.out -w "%{http_code}" "$u" 2>err.txt)
            title=$(grep -o "<title>[^<]*</title>" page.out 2>/dev/null | head -1)
            echo "::notice title=$u::HTTP $code $title $(head -c 150 err.txt) | $(head -c 100 page.out | tr -d '\n\r')"
          done
      - name: Пропуск
        if: env.FTP_SERVER == ''
        run: echo "Секреты FTP не заданы, выкладка на хостинг пропущена"

  release:
    name: Релиз latest
    needs: [android, ios, windows, linux, web, server]
    if: always() && github.ref == 'refs/heads/main' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          pattern: Xitter-*
          merge-multiple: true
      - name: Обновить релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "Xitter · сборка #${{ github.run_number }}" --target "${{ github.sha }}" \
            --notes "Автосборка из ${{ github.sha }}. Xitter.exe — Windows без установки, Xitter-Setup.exe — установщик для Windows, Xitter-x86_64.AppImage — Linux, Xitter.apk — Android, Xitter-unsigned.ipa — iPhone (подписать через Sideloadly/AltStore), Xitter-web.zip — веб-версия, Xitter-server.zip — сервер для своего компьютера." \
            --prerelease
